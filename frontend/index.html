<!-- The landing page of the web app -->
<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Similarity App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="landing-page">
    <div class="container">
        <h1 class="logo">Song Similarity App</h1>
        <p class="tagline">Discover songs that are similar to your favorite songs!</p>
        
        <form id="searchForm" class="search-form">
          <div class="search-box">
            <input type="text" id="songTitle" placeholder="Song Title" required autocomplete="off">
            <input type="text" id="artistName" placeholder="Artist Name" required autocomplete="off">
            <button type="submit" class="search-btn">Search</button>
          </div>

          <p class="error-message" id="errorMessage"></p>
        </form>

        <div class="nav-links">
            <a href="history.html">Search History</a>
            <a href="favourites.html">Favourites</a>
        </div>
    </div>

    <div class="transition-overlay" id="transitionOverlay"></div>

</body>

<script src="/frontend/js/search.js"></script>
</html>
